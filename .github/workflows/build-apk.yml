name: Build release APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'apk/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APK_NAME: 오._RegenCoach_release.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Copy APK to apk/
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk "apk/${APK_NAME}"
          ls -la apk

      - uses: actions/upload-artifact@v4
        with:
          name: regen-coach-release-apk
          path: apk/*.apk

      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/
          git diff --cached --quiet || git commit -m "Build: release APK 업데이트 [skip ci]"
          git push
